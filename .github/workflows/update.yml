name: Update dashboard

on:
  schedule:
    - cron: "0 5 * * 2,5"    # every day at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download data and build the database
        run: |
          python -m src.database.download_history
          python -m src.database.download_gameweeks
          python -m src.database.build_db

      - name: Export the dashboard data
        run: python -m dashboard.export

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          git diff --staged --quiet || git commit -m "Update dashboard data"
          git push
